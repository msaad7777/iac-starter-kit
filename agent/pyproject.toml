[project]
name = "kit-agent"
version = "0.1.0"
description = "Provisioning agent: a plain-English request becomes Terragrunt units from the kit's modules, checked by the kit's gates, on a branch for a human to review"
readme = "README.md"
authors = [{ name = "Mohammed Saad", email = "59375560+msaad7777@users.noreply.github.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "diagrams>=0.25.1",
]

[project.scripts]
kit-agent = "kit_agent:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kit_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
